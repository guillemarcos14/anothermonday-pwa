<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Another Monday</title>

    <!-- PWA -->
    <meta name="theme-color" content="#679974" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Another Monday" />
    <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
    <meta name="description" content="Another Monday — Pide con antelación, recoge sin esperas y acumula recompensas en cada visita." />

    <!-- Font: Inter + Instrument Serif -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />

    <!-- Splash screen -->
    <style>
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        background: #679974;
        transition: opacity 0.5s ease;
      }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash img { width: 250px; height: 250px; }
    </style>
  </head>
  <body>
    <div id="splash">
      <img src="/icons/logo-splash.png" alt="Another Monday" />
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
